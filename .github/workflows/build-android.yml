name: Build MobileGlues for Android arm64-v8a
on: [push, workflow_dispatch]
jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      NDK_VERSION: 27.3.13750724
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.29.6"

      - name: Install Android NDK
        run: |
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;${{ env.NDK_VERSION }}" > /dev/null

      - name: Build MobileGlues
        run: |
          cd MobileGlues-cpp
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DSTATICLIB=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wno-error=implicit-function-declaration" > /tmp/cmake-configure.log 2>&1
          configure_rc=$?
          if [ $configure_rc -ne 0 ]; then
            echo "CMAKE CONFIGURE FAILED rc=$configure_rc"
            tail -n 60 /tmp/cmake-configure.log
            exit $configure_rc
          fi
          # Keep the full log in a file instead of the step output: a verbose
          # build log gets truncated by the Actions UI, which hides the actual
          # error, and the raw log endpoint is not reachable from where these
          # failures get investigated.
          cmake --build build --config Release --target mobileglues > /tmp/cmake-build.log 2>&1
          build_rc=$?
          if [ $build_rc -ne 0 ]; then
            echo "BUILD FAILED rc=$build_rc"
            # Also into the step summary: the step log gets truncated in the UI
            # and the raw-log endpoint is not reachable from the environment
            # where these failures are investigated, so the summary is the
            # channel that reliably carries the message back.
            {
              echo '### Build errors'
              echo '```'
              grep -nE "error:|error [0-9]+|FAILED|fatal error|undefined reference" /tmp/cmake-build.log | head -n 40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -nE "error:|error [0-9]+|FAILED|fatal error|undefined reference" /tmp/cmake-build.log | head -n 40
            exit $build_rc
          fi
          tail -n 5 /tmp/cmake-build.log

      - name: Report build errors where they can be read
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The raw-log endpoint is not reachable from where these failures get
          # investigated, and the step log is truncated in the UI, so the errors
          # are published into an issue where they can actually be read.
          {
            echo "Build failed for ${{ github.sha }} (run ${{ github.run_id }})"
            echo ""
            echo "## Errors"
            echo '```'
            grep -nE "error:|error [0-9]+|FAILED|fatal error|undefined reference" /tmp/cmake-build.log | head -n 60
            echo '```'
            echo ""
            echo "## Tail of build log"
            echo '```'
            tail -n 120 /tmp/cmake-build.log
            echo '```'
          } > /tmp/report.md
          gh label create ci-failure --force > /dev/null 2>&1
          gh issue create --repo "$GH_REPO" --title "CI build failure ${{ github.sha }}" \
            --body-file /tmp/report.md > /tmp/issue.out 2>&1
          echo "issue create rc=$?" >> /tmp/report.md
          cat /tmp/issue.out >> /tmp/report.md 2>/dev/null

          # git push from the runner has been failing silently (the branch never
          # appeared), and the raw-log endpoint is blocked, so the text is put
          # through the contents API directly. That is the one channel that has
          # been reliably reachable. The file stays on a scratch branch; the API
          # creates or updates it whichever already exists.
          python3 <<'PYEOF'
import base64, json, os, urllib.request

repo = os.environ["GH_REPO"]
token = os.environ["GH_TOKEN"]
sha = os.environ.get("GITHUB_SHA", "")
path = "ci-last-failure.md"
ref = "ci-failure-logs"
body = open("/tmp/report.md", "rb").read()

def api(method, url, payload=None):
    data = json.dumps(payload).encode() if payload is not None else None
    req = urllib.request.Request(url, data=data, method=method)
    req.add_header("Authorization", "Bearer " + token)
    req.add_header("Accept", "application/vnd.github+json")
    if data:
        req.add_header("Content-Type", "application/json")
    try:
        with urllib.request.urlopen(req) as r:
            return json.loads(r.read().decode() or "{}")
    except Exception as e:
        print("api", method, url, "->", e)
        return {}

base = "https://api.github.com/repos/%s" % repo
# Make sure the branch exists, pointing at the current commit or at main.
main = api("GET", base + "/git/ref/heads/main") or api("GET", base + "/git/ref/heads/master")
if main.get("object"):
    api("POST", base + "/git/refs", {"ref": "refs/heads/" + ref, "sha": main["object"]["sha"]})

existing = api("GET", "%s/contents/%s?ref=%s" % (base, path, ref))
payload = {
    "message": "CI failure log for " + sha,
    "content": base64.b64encode(body).decode(),
    "branch": ref,
}
if isinstance(existing, dict) and existing.get("sha"):
    payload["sha"] = existing["sha"]
res = api("PUT", "%s/contents/%s" % (base, path), payload)
print("uploaded:", bool(res.get("commit")))
PYEOF

      - name: Strip shared library
        run: |
          STRIP="${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          LIB_PATH="MobileGlues-cpp/build/libmobileglues.so"
          echo "Before strip: $(stat -c%s ${LIB_PATH}) bytes"
          ${STRIP} --strip-all ${LIB_PATH}
          echo "After strip: $(stat -c%s ${LIB_PATH}) bytes"

      - name: Upload lib
        uses: actions/upload-artifact@v4
        with:
          name: MobileGlues-Android-arm64-v8a
          path: MobileGlues-cpp/build/libmobileglues.so
